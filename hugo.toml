baseURL = 'https://qq.laosong.cloud/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '秋秋的菜谱'
theme = 'ananke'
author = '秋秋'

# SEO：生成 robots.txt（主题模板已含 Sitemap 声明）
enableRobotsTXT = true

# 构建配置
[build]
  buildFuture = true

# 分类和标签
[taxonomies]
category = 'categories'
tag = 'tags'

# 菜单导航
[[menu.main]]
  name = "首页"
  pageRef = "/"
  weight = 1
[[menu.main]]
  name = "所有菜谱"
  pageRef = "/posts/"
  weight = 2
[[menu.main]]
  name = "搜索"
  pageRef = "/search/"
  weight = 3
